name: Deploy Hex Mayhem Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *" # Daily refresh, UTC; source metadata controls patch reporting

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check data.js
          node --check roster.js
          node --check reference-data.js
          node --check verified-data.js
          node --check build-evidence.js
          node --check app.js
          node --check scripts/sync-reference.cjs
      - name: Validate initial strategy catalog
        run: node tests/smoke.cjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build attributed public-data snapshot
        run: node scripts/sync-reference.cjs
      - name: Package static files
        run: |
          mkdir -p _site
          cp index.html app.js data.js roster.js reference-data.js verified-data.js build-evidence.js styles.css favicon.svg .nojekyll _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4